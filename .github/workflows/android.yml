name: Costruisci APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installa dipendenze
        run: npm install
      - name: Crea il progetto Android
        run: npx cap add android
      - name: Icona e margini
        run: |
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 34/' android/variables.gradle || true
          npx -y @capacitor/assets generate --android --iconBackgroundColor '#0d9488' --iconBackgroundColorDark '#0d9488' || true
      - name: Sincronizza la web app
        run: npx cap sync android
      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RepoScout-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
